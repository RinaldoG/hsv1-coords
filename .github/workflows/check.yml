name: check
on:
  push:
  pull_request:
  schedule:
    # Weekly, so an input moving upstream is caught without anyone watching.
    - cron: "0 19 * * 1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch inputs
        run: make inputs
      - name: Verify inputs and assumptions
        run: make check
      - name: Rebuild derived name tables
        run: make names
      - name: Rebuild the annotation table
        run: make annotation
      - name: Rebuild the synonymy test cases from the prose document
        run: make testcases
      - name: Fail if any rebuilt file differs from what is committed
        run: git diff --exit-code -- data/derived tests/testcases_synonymy.tsv
      - name: Milestone gates
        run: make test
