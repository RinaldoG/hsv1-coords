name: check
on:
  push:
  pull_request:
  schedule:
    # Weekly, so an upstream record changing under us is caught without anyone watching.
    - cron: "0 19 * * 1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimap2
        # A declared dependency of the crosswalk. Without it `make crosswalk` never runs
        # and the largest artefact in the repository goes unverified.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minimap2
          minimap2 --version

      - name: Check the library needs nothing installed
        # Round 9: requirements.txt pinned openpyxl, which nothing in src/ or tests/
        # imports, and CI installed it on every run. The library is standard library
        # only, and this asserts that rather than leaving it to be noticed again.
        run: |
          test ! -f requirements.txt
          python3 -c "import hsv1coords" 2>/dev/null || PYTHONPATH=src python3 -c "import hsv1coords; print('stdlib only')"

      - name: Fetch inputs
        run: make inputs


      - name: Fail if any input changed upstream
        # `make inputs` rewrites MANIFEST.tsv, so checking files against the manifest it
        # has just written proves nothing: that gate cannot fail. Diffing the regenerated
        # manifest against the committed one is what actually detects an upstream record
        # changing, which is the whole point of the weekly run.
        run: git diff --exit-code -- data/raw/MANIFEST.tsv

      - name: Verify the stated assumptions still hold
        run: make check

      - name: Fetch the pinned genome set
        run: make genomes

      - name: Check the COMMITTED crosswalk against a fresh alignment
        # Before the rebuild below overwrites it, which is the only moment a corrupted
        # committed block file is still visible. Round 10: a block moved to another
        # position where the bases still match is invisible to every sequence-identity
        # check, because inside a tandem array the reference is periodic, and 3,868
        # positions were put at a wrong coordinate with the whole suite green. The
        # rebuild-and-diff step below would also catch it, but only as a diff in 183
        # files; this names the block.
        run: make verify-crosswalk

      - name: Rebuild every derived artefact
        run: |
          make names
          make aliases
          make annotation
          make crosswalk
          make versions
          make repeatmap
          make agreement
          make testcases

      - name: Fail if any rebuilt file differs from what is committed
        # Covers the whole directory rather than a handful of named files, and
        # `git status --porcelain` catches a NEW or untracked file, which `git diff`
        # alone cannot see.
        run: |
          git diff --exit-code -- data/derived tests/testcases_synonymy.tsv data/accessions.txt
          if [ -n "$(git status --porcelain -- data/derived tests data/accessions.txt)" ]; then
            echo "Untracked or modified files after rebuild:"
            git status --porcelain -- data/derived tests data/accessions.txt
            exit 1
          fi

      - name: Milestone gates
        run: make test
