[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsv1coords"
version = "0.2.0"
description = "A coordinate and annotation layer for herpes simplex virus 1"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Homepage = "https://github.com/RinaldoG/hsv1-coords"

[tool.setuptools]
package-dir = { "" = "src" }
# The data is the library: without it every loader raises. Round 11 found `pip install .`
# producing an importable package in which nothing worked, because the modules resolved
# their paths against the repository layout. `make package-data` copies the built
# artefacts into src/hsv1coords/data, and this ships them.
include-package-data = true

[tool.setuptools.package-data]
# Round 12: `accessions.txt` was staged by the staging script and matched by no glob
# here, so it was copied into the package and then left out of the wheel while the
# script printed success. The staging script now checks every staged file against these
# globs and fails if one would not ship.
hsv1coords = ["data/*.tsv", "data/*.txt", "data/*.sha256", "data/derived/*.tsv",
              "data/derived/*.md", "data/derived/crosswalk/*.tsv"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hsv1coords*"]
