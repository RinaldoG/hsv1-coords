[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsv1coords"
version = "0.1.0"
description = "A coordinate and annotation layer for herpes simplex virus 1"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Homepage = "https://github.com/RinaldoG/hsv1-coords"

[tool.setuptools]
package-dir = { "" = "src" }
# The data is the library: without it every loader raises. Round 11 found `pip install .`
# producing an importable package in which nothing worked, because the modules resolved
# their paths against the repository layout. `make package-data` copies the built
# artefacts into src/hsv1coords/data, and this ships them.
include-package-data = true

[tool.setuptools.package-data]
hsv1coords = ["data/*.tsv", "data/*.sha256", "data/derived/*.tsv", "data/derived/*.md",
              "data/derived/crosswalk/*.tsv"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hsv1coords*"]
