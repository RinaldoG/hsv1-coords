[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsv1coords"
version = "0.1.0"
description = "A coordinate and annotation layer for herpes simplex virus 1"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Homepage = "https://github.com/RinaldoG/hsv1-coords"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["hsv1coords*"]
